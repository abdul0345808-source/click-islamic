<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic Quiz - 100 Levels</title>
    <!-- الگ CSS فائل کا لنک -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- اسپلش اسکرین (Splash Screen Bug Fix) -->

        <h1>اسلامی کوئز گیم</h1>
        <p>100 لیولز کا سفر - خوش آمدید</p>
    </div>

    <!-- گیم کا مرکزی کنٹینر -->
    <div id="game-container" style="display: none;">
        <h2 id="level-title">لیول 1</h2>
        <div id="question-box">سوال یہاں ظاہر ہوگا...</div>
        <div id="options-box">
            <!-- آپشنز یہاں متحرک انداز میں آئیں گے -->
        </div>
    </div>

    <!-- الگ JavaScript فائل کا لنک -->
    <script src="js/script.js"></script>

</html>
